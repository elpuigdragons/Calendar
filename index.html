<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragons El Puig — Calendario unificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0D0C;
    --bg-alt: #161514;
    --card: #1B1918;
    --ink: #F5F3EF;
    --ink-dim: #928D86;
    --ember: #C8202C;
    --silver: #E2E0DB;
    --line: #2A2826;
    --win: #4FBF6E;
    --loss: #E14B4B;
    --draw: #D9A536;
    --black-team: #0E0D0C;
    --white-team: #F5F3EF;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .display {
    font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 0.86;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; }

  /* ---------- HERO ---------- */
  header.hero {
    position: relative;
    padding: 56px 0 34px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .hero-flame {
    position: absolute;
    top: -30%; right: -14%;
    width: 55%; height: 160%;
    background: radial-gradient(circle at 60% 40%, rgba(200,32,44,0.16), transparent 65%);
    pointer-events: none;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .badge {
    width: clamp(84px, 18vw, 128px);
    height: clamp(84px, 18vw, 128px);
    border-radius: 22px;
    flex: none;
    object-fit: contain;
    background: var(--silver);
    padding: 8px;
    box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,0.5);
  }
  h1.club-name {
    font-size: clamp(2.5rem, 9vw, 5.2rem);
    margin: 0;
    color: var(--ink);
  }
  h1.club-name .accent { color: var(--ember); }
  .hero-sub {
    max-width: 52ch;
    color: var(--ink-dim);
    font-size: 1.02rem;
    margin: 16px 0 0;
    line-height: 1.55;
  }

  /* ---------- NEXT MATCH ---------- */
  .next-match {
    margin-top: 32px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ember);
    border-radius: 3px;
    padding: 20px 24px;
  }
  .nm-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
  }
  .nm-header .label { font-size: 0.8rem; color: var(--ink-dim); }
  .nm-list { display: flex; flex-direction: column; }
  .nm-item {
    padding-top: 14px;
    margin-top: 14px;
    border-top: 1px solid var(--line);
  }
  .nm-item:first-child { padding-top: 16px; margin-top: 16px; }
  .nm-item .tag-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .nm-item .cat-label { font-size: 0.78rem; color: var(--ink-dim); }
  .nm-item .matchup {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--ink);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0;
  }
  .nm-item .matchup .dragons { color: var(--ember); }
  .nm-item .matchup .vs { color: var(--ink-dim); font-weight: 500; padding: 0 8px; font-family: 'Manrope', sans-serif; font-size: 0.92rem; }
  .nm-item .meta { color: var(--ink-dim); font-size: 0.86rem; margin-top: 4px; }
  .countdown { display: flex; gap: 12px; }
  .countdown .unit { text-align: center; min-width: 48px; }
  .countdown .num { font-family: 'Big Shoulders Display', sans-serif; font-size: 1.7rem; font-weight: 800; color: var(--ember); line-height: 1; }
  .countdown .u-label { font-size: 0.64rem; color: var(--ink-dim); margin-top: 2px; }

  /* ---------- VIEW TABS (Próximos / Jugados) ---------- */
  .view-tabs {
    display: inline-flex;
    margin-top: 28px;
    background: var(--bg-alt);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 4px;
    gap: 4px;
  }
  .view-tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px;
    border-radius: 100px;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--ink-dim);
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s;
  }
  .view-tab .count {
    font-size: 0.72rem;
    font-weight: 700;
    background: var(--card);
    color: var(--ink-dim);
    padding: 2px 8px;
    border-radius: 100px;
  }
  .view-tab:not(.active):hover { color: var(--ink); }
  .view-tab.active { background: var(--ember); color: #FFFFFF; }
  .view-tab.active .count { background: rgba(0,0,0,0.25); color: #FFFFFF; }
  .view-tabs + .filters { margin-top: 18px; }

  /* ---------- FILTERS ---------- */
  .filters {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin: 28px 0 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    padding: 8px 14px;
    border-radius: 100px;
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip.active {
    background: var(--ember);
    border-color: var(--ember);
    color: #FFFFFF;
  }
  .chip:not(.active):hover { border-color: var(--silver); color: var(--ink); }

  /* ---------- MATCH LIST ---------- */
  main { padding: 24px 0 8px; }
  .month-heading {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--silver);
    margin: 30px 0 4px;
    padding-top: 10px;
  }
  .month-heading:first-child { margin-top: 6px; }
  .fixture {
    display: grid;
    grid-template-columns: 58px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 15px 0;
    border-top: 1px solid var(--line);
  }
  .fixture .date { text-align: center; }
  .fixture .date .day {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 1.55rem;
    color: var(--ink);
    display: block;
    line-height: 1;
  }
  .fixture .date .wd { font-size: 0.68rem; color: var(--ink-dim); text-transform: lowercase; }
  .fixture .info .tags { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; flex-wrap: wrap; }
  .team-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .team-dot.negro { background: var(--black-team); border: 1px solid var(--silver); }
  .team-dot.blanco { background: var(--white-team); border: 1px solid var(--ember); }
  .cat-tag { font-size: 0.72rem; color: var(--ink-dim); }
  .jor-tag { font-size: 0.72rem; color: var(--ink-dim); }
  .jor-tag::before { content: '· '; }
  .fixture .teams {
    font-weight: 700; font-size: 0.98rem; line-height: 1.35;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0;
  }
  .fixture .teams .dragons { color: var(--ember); }
  .fixture .teams .vs { color: var(--ink-dim); font-weight: 500; padding: 0 8px; }
  .fixture .venue { color: var(--ink-dim); font-size: 0.82rem; margin-top: 6px; }
  .fixture .venue .hora { color: var(--ink); font-weight: 600; }
  .fixture .right-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .result-badge {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
  }
  .result-badge.win { color: var(--win); }
  .result-badge.loss { color: var(--loss); }
  .result-badge.draw { color: var(--draw); }
  .result-badge.pending { font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 0.78rem; color: var(--ink-dim); }
  .map-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.76rem; color: var(--silver); text-decoration: none;
    border: 1px solid var(--line); padding: 5px 10px; border-radius: 100px;
    white-space: nowrap;
  }
  .map-link:hover { border-color: var(--silver); }
  .empty-state { color: var(--ink-dim); padding: 40px 0; font-size: 0.95rem; }

  .error-state { border: 1px solid var(--line); border-left: 3px solid var(--loss); background: var(--card); padding: 20px 24px; border-radius: 3px; margin-top: 10px; line-height: 1.55; }
  .error-state p { margin: 0 0 14px; color: var(--ink); }
  .retry-btn { background: var(--ember); color: #fff; border: 0; padding: 9px 18px; border-radius: 100px; font: 700 0.86rem 'Manrope', sans-serif; cursor: pointer; }
  .retry-btn:hover { filter: brightness(1.1); }

  /* ---------- LOGOS DE EQUIPO ---------- */
  .team { display: inline-flex; align-items: center; gap: 8px; }
  .team-logo {
    width: 28px; height: 28px; flex: none;
    object-fit: contain;
    background: var(--silver);
    border-radius: 8px;
    padding: 2px;
  }
  .nm-item .team-logo { width: 34px; height: 34px; }

  /* ---------- SOURCE / FOOTER ---------- */
  .source-tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg-alt);
    border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 100px;
    font-size: 0.78rem; color: var(--ink-dim);
    margin-top: 26px;
  }
  .source-tag .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--draw); }
  footer {
    padding: 30px 0 calc(40px + env(safe-area-inset-bottom, 0px));
    color: var(--ink-dim);
    font-size: 0.82rem;
    line-height: 1.6;
    border-top: 1px solid var(--line);
    margin-top: 20px;
  }

  @media (max-width: 560px) {
    .fixture { grid-template-columns: 44px 1fr; }
    .fixture .right-col { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; margin-top: 6px; }
  }
</style>
</head>

<script>
/* ---------- Google Sheet publicado como CSV ---------- */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSl5xg397GTfLDogRcVZAXObRrp8JH7-j5YAlel0hNU1Sb33IS_WT0KxKDY_5fNKuL_YWnqUubSiG25/pub?gid=795521530&single=true&output=csv";

/* ---------- Logos: regla (sobre el nombre del equipo) → archivo en /logos ---------- */
const LOGO_RULES = [
  [/DRAGONS/i,    'puig.png'],
  [/ALAS/i,       'alas.png'],
  [/DIABLOS/i,    'dia.png'],
  [/DINO/i,       'dino.png'],
  [/HALCONES/i,   'hal.png'],
  [/CASTELL/i,    'hcc.png'],
  [/SKULLS/i,     'skulls.png'],
  [/TAURONS/i,    'tau.png'],
  [/TITANES/i,    'tita.png'],
  [/LLOPS|VILA/i, 'vila.png']
];
function logoFor(name) {
  const hit = LOGO_RULES.find(([re]) => re.test(name));
  return hit ? 'logos/' + hit[1] : '';
}

/* ---------- Parser CSV mínimo ---------- */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  const pushField = () => { row.push(field); field = ''; };
  const pushRow = () => { rows.push(row); row = []; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') pushField();
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { pushField(); pushRow(); }
      else field += c;
    }
  }
  if (field.length || row.length) { pushField(); pushRow(); }
  const clean = rows.filter(r => r.some(f => f.trim() !== ''));
  const headers = clean[0].map(h => h.trim());
  return clean.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, idx) => obj[h] = (r[idx] ?? '').trim());
    return obj;
  });
}

/* ---------- Normalización de fecha/hora ---------- */
function normDate(raw) {
  if (!raw) return null;
  let s = raw.trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function normTime(raw) {
  if (!raw) return '';
  const s = raw.trim().replace('.', ':');
  const m = s.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return '';
  return String(m[1]).padStart(2, '0') + ':' + m[2];
}

async function loadFixtures() {
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text());
    const fixtures = rows.map(r => {
      const dateObj = normDate(r['Fecha']);
      return {
        categoria: r['Categoría'] || '',
        dateObj,
        hora: normTime(r['Hora']),
        pista: r['Instalación / Pista'] || '',
        jornada: (r['Jornada'] || '').replace(/^JORNADA\s*/i, '').replace(/^J\s*/i, ''),
        local: r['Equipo Local'] || '',
        visitante: r['Equipo Visitante'] || '',
        resultado: (r['Resultado'] || '').trim() === '-' ? '' : (r['Resultado'] || '').trim(),
        mapa: r['Mapa'] || ''
      };
    }).filter(f => f.dateObj);
    if (!fixtures.length) throw new Error('La hoja no contiene partidos');
    return fixtures;
  } catch (e) {
    console.error('No se pudo cargar la hoja.', e);
    return null;
  }
}

function showLoadError() {
  document.getElementById('nm-label').textContent = 'No se ha podido cargar la información';
  document.getElementById('nm-list').innerHTML = '';
  document.getElementById('countdown').style.display = 'none';
  document.getElementById('view-tabs').innerHTML = '';
  document.getElementById('filters').innerHTML = '';
  document.getElementById('fixture-container').innerHTML = `
    <div class="empty-state error-state">
      <p><strong>No se ha podido cargar el calendario.</strong><br>
      Comprueba tu conexión e inténtalo de nuevo. Si el problema continúa, consulta los horarios en la web de la federación.</p>
      <button class="retry-btn" onclick="location.reload()">Reintentar</button>
    </div>`;
  document.getElementById('source-dot').style.background = 'var(--loss)';
  document.getElementById('source-text').textContent = 'Error al conectar con origen de datos';
}

/* ---------- Ayudas de presentación ---------- */
const CATEGORIES = ['PreBenjamín', 'Benjamín Blanco', 'Benjamín Negro', 'Alevín Blanco', 'Alevín Negro', 'Infantil', 'Juvenil'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WEEKDAYS = ['dom','lun','mar','mié','jue','vie','sáb'];

function isDragons(name) { return /DRAGONS/i.test(name); }
function teamColor(categoria) { return /Negro/i.test(categoria) ? 'negro' : 'blanco'; }
function highlightTeam(name) {
  const short = name.replace(/DRAGONS EL PUIG\s*/i, 'Dragons ').trim();
  const label = isDragons(name) ? `<span class="dragons">${short}</span>` : name;
  const src = logoFor(name);
  const img = src
    ? `<img class="team-logo" src="${src}" alt="" width="28" height="28" loading="lazy" onerror="this.remove()">`
    : '';
  return `<span class="team">${img}${label}</span>`;
}

let ALL_FIXTURES = [];
let activeFilter = 'Todos';
let activeView = 'proximos';

function startOfToday() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function isPlayed(f) {
  return !!f.resultado || f.dateObj < startOfToday();
}

function renderViewTabs() {
  const base = activeFilter === 'Todos' ? ALL_FIXTURES : ALL_FIXTURES.filter(f => f.categoria === activeFilter);
  const played = base.filter(isPlayed).length;
  const upcoming = base.length - played;
  const el = document.getElementById('view-tabs');
  el.innerHTML = `
    <span class="view-tab ${activeView === 'proximos' ? 'active' : ''}" data-view="proximos">Próximos <span class="count">${upcoming}</span></span>
    <span class="view-tab ${activeView === 'jugados' ? 'active' : ''}" data-view="jugados">Jugados <span class="count">${played}</span></span>
  `;
  el.querySelectorAll('.view-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeView = tab.dataset.view;
      renderViewTabs();
      renderList();
    });
  });
}

function renderFilters() {
  const el = document.getElementById('filters');
  const all = ['Todos', ...CATEGORIES];
  el.innerHTML = all.map(cat => {
    const dot = cat === 'Todos' ? '' : `<span class="dot" style="background:${teamColor(cat) === 'negro' ? 'var(--black-team)' : 'var(--white-team)'}; border:1px solid ${teamColor(cat) === 'negro' ? 'var(--silver)' : 'var(--ember)'}"></span>`;
    return `<span class="chip ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}">${dot}${cat}</span>`;
  }).join('');
  el.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeFilter = chip.dataset.cat;
      renderFilters();
      renderViewTabs();
      renderList();
      renderNextMatch();
    });
  });
}

function filteredFixtures() {
  const list = activeFilter === 'Todos' ? ALL_FIXTURES : ALL_FIXTURES.filter(f => f.categoria === activeFilter);
  return [...list].sort((a, b) => {
    const dateDiff = a.dateObj - b.dateObj;
    if (dateDiff !== 0) return dateDiff;
    if (a.hora && b.hora) return a.hora.localeCompare(b.hora);
    if (a.hora) return -1;
    if (b.hora) return 1;
    return 0;
  });
}

function visibleFixtures() {
  const list = filteredFixtures();
  if (activeView === 'jugados') return list.filter(isPlayed).reverse();
  return list.filter(f => !isPlayed(f));
}

function renderList() {
  const container = document.getElementById('fixture-container');
  const list = visibleFixtures();
  if (!list.length) {
    const msg = activeView === 'jugados'
      ? 'Todavía no hay partidos jugados para este filtro.'
      : 'No quedan partidos por jugar para este filtro.';
    container.innerHTML = `<div class="empty-state">${msg}</div>`;
    return;
  }
  let html = '';
  let lastMonthKey = '';
  list.forEach(f => {
    const monthKey = f.dateObj.getFullYear() + '-' + f.dateObj.getMonth();
    if (monthKey !== lastMonthKey) {
      html += `<div class="month-heading display">${MONTHS[f.dateObj.getMonth()]} ${f.dateObj.getFullYear()}</div>`;
      lastMonthKey = monthKey;
    }
    let resultHTML;
    if (!f.resultado) {
      resultHTML = `<div class="result-badge pending">${isPlayed(f) ? 'Sin resultado' : 'Por jugar'}</div>`;
    } else {
      const parts = f.resultado.split('-').map(Number);
      const [a, b] = parts;
      const dragonsLocal = isDragons(f.local);
      const nuestro = dragonsLocal ? a : b;
      const rival = dragonsLocal ? b : a;
      const cls = nuestro > rival ? 'win' : nuestro < rival ? 'loss' : 'draw';
      resultHTML = `<div class="result-badge ${cls}">${f.resultado}</div>`;
    }
    const mapaHTML = f.mapa ? `<a class="map-link" href="${f.mapa}" target="_blank" rel="noopener">📍 Mapa</a>` : '';
    html += `
      <div class="fixture">
        <div class="date">
          <span class="day">${f.dateObj.getDate()}</span>
          <span class="wd">${WEEKDAYS[f.dateObj.getDay()]}</span>
        </div>
        <div class="info">
          <div class="tags">
            <span class="team-dot ${teamColor(f.categoria)}"></span>
            <span class="cat-tag">${f.categoria}</span>
            <span class="jor-tag">Jornada ${f.jornada}</span>
          </div>
          <div class="teams">${highlightTeam(f.local)}<span class="vs">vs</span>${highlightTeam(f.visitante)}</div>
          <div class="venue">${f.pista}${f.hora ? ` · <span class="hora">${f.hora}</span>` : ''}</div>
        </div>
        <div class="right-col">
          ${resultHTML}
          ${mapaHTML}
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

let countdownTimer = null;
function renderNextMatch() {
  const upcoming = filteredFixtures().filter(f => !isPlayed(f));
  if (!upcoming.length) {
    document.getElementById('nm-label').textContent = 'No hay más partidos programados';
    document.getElementById('nm-list').innerHTML = '';
    document.getElementById('countdown').style.display = 'none';
    return;
  }
  const nextDateKey = upcoming[0].dateObj.getTime();
  const dayMatches = upcoming.filter(f => f.dateObj.getTime() === nextDateKey);

  document.getElementById('countdown').style.display = 'flex';
  const dateStr = dayMatches[0].dateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  const labelPrefix = dayMatches.length > 1 ? `Próximos partidos · ${dateStr}` : `Próximo partido · ${dateStr}`;
  document.getElementById('nm-label').textContent = labelPrefix;

  document.getElementById('nm-list').innerHTML = dayMatches.map(f => `
    <div class="nm-item">
      <div class="tag-row">
        <span class="team-dot ${teamColor(f.categoria)}"></span>
        <span class="cat-label">${f.categoria} · Jornada ${f.jornada}</span>
      </div>
      <div class="matchup">${highlightTeam(f.local)}<span class="vs">vs</span>${highlightTeam(f.visitante)}</div>
      <div class="meta">${f.hora ? f.hora + ' · ' : 'Hora por confirmar · '}${f.pista}</div>
    </div>
  `).join('');

  if (countdownTimer) clearInterval(countdownTimer);
  const targetDate = new Date(dayMatches[0].dateObj);
  const withTime = dayMatches.find(f => f.hora);
  if (withTime) {
    const [hh, mm] = withTime.hora.split(':').map(Number);
    targetDate.setHours(hh, mm, 0, 0);
  }
  function tick() {
    let diff = targetDate - new Date();
    if (diff < 0) diff = 0;
    document.getElementById('cd-d').textContent = Math.floor(diff / 86400000);
    document.getElementById('cd-h').textContent = Math.floor((diff % 86400000) / 3600000);
    document.getElementById('cd-m').textContent = Math.floor((diff % 3600000) / 60000);
  }
  tick();
  countdownTimer = setInterval(tick, 30000);
}

(async function init() {
  const data = await loadFixtures();
  if (!data) { showLoadError(); return; }
  ALL_FIXTURES = data;
  renderFilters();
  renderViewTabs();
  renderList();
  renderNextMatch();
  document.getElementById('source-dot').style.background = 'var(--win)';
  document.getElementById('source-text').textContent = 'Datos en vivo';
})();
</script>
</body>
</html>
