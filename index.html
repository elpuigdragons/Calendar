<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Dragons 2026-2027</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- PapaParse para leer el CSV publicado de Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        .free-weekend { background-color: #d1fae5; border-color: #10b981; }
        .busy-weekend { background-color: #fee2e2; border-color: #ef4444; }
        .partial-weekend { background-color: #fef3c7; border-color: #f59e0b; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-700 p-2 rounded-xl">
                    <i data-lucide="calendar" class="w-6 h-6 text-amber-400"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Dragons El Puig</h1>
                    <p class="text-xs text-indigo-200 flex items-center gap-1.5 mt-0.5">
                        <span id="sync-status" class="inline-block w-2 h-2 rounded-full bg-amber-400"></span>
                        <span id="sync-text">Cargando datos en vivo de Google Sheets...</span>
                    </p>
                </div>
            </div>
            
            <!-- Tab Selector -->
            <div class="flex bg-indigo-950 p-1 rounded-xl gap-1 text-sm">
                <button id="tab-calendar" onclick="switchView('calendar')" class="px-3 py-1.5 rounded-lg font-medium transition bg-indigo-600 text-white shadow-sm flex items-center gap-1.5">
                    <i data-lucide="calendar-days" class="w-4 h-4"></i> Vista Calendario
                </button>
                <button id="tab-list" onclick="switchView('list')" class="px-3 py-1.5 rounded-lg font-medium transition text-indigo-200 hover:text-white flex items-center gap-1.5">
                    <i data-lucide="list-todo" class="w-4 h-4"></i> Lista de Partidos
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- Controls / Filters -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-6">
            <div class="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                
                <!-- Category Selectors -->
                <div class="w-full md:w-auto flex-grow">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Filtrar por Categoría(s)</label>
                    <div id="category-buttons" class="flex flex-wrap gap-2">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Month Filter for Calendar -->
                <div class="w-full md:w-auto">
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Periodo / Mes</label>
                    <select id="month-select" onchange="renderView()" class="w-full md:w-48 bg-slate-100 border border-slate-300 text-slate-800 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="ALL">Todo el Calendario</option>
                        <option value="2026-09">Septiembre 2026</option>
                        <option value="2026-10" selected>Octubre 2026</option>
                        <option value="2026-11">Noviembre 2026</option>
                        <option value="2026-12">Diciembre 2026</option>
                        <option value="2027-01">Enero 2027</option>
                        <option value="2027-02">Febrero 2027</option>
                        <option value="2027-03">Marzo 2027</option>
                        <option value="2027-04">Abril 2027</option>
                        <option value="2027-05">Mayo 2027</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Legend Bar (Only visible in Calendar view) -->
        <div id="calendar-legend" class="flex flex-wrap items-center justify-center gap-4 bg-white p-3 rounded-xl border border-slate-200 shadow-sm mb-6 text-xs font-medium text-slate-600">
            <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-md bg-emerald-100 border border-emerald-500"></span>
                <span>Fin de Semana Libre (Sin Partidos)</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-md bg-amber-100 border border-amber-500"></span>
                <span>Parcial (Libre para alguna categoría)</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-md bg-rose-100 border border-rose-500"></span>
                <span>Ocupado (Con Partidos)</span>
            </div>
        </div>

        <!-- View 1: Calendar Grid Container -->
        <div id="calendar-container" class="space-y-8">
            <!-- Calendar months rendered dynamically -->
        </div>

        <!-- View 2: List Matches Container -->
        <div id="list-container" class="hidden space-y-3">
            <!-- List rendered dynamically -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800 mt-8 text-center">
        <p>© 2026 Dragons El Puig Hockey Club • Sincronizado automáticamente con Google Sheets.</p>
    </footer>

    <!-- Application Script -->
    <script>
        // Public Google Sheets Published CSV URL
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSl5xg397GTfLDogRcVZAXObRrp8JH7-j5YAlel0hNU1Sb33IS_WT0KxKDY_5fNKuL_YWnqUubSiG25/pub?gid=795521530&single=true&output=csv';

        let RAW_DATA = [];
        let ALL_CATEGORIES = [];

        // App state
        let currentView = 'calendar';
        let selectedCategories = ['Benjamín Negro', 'Alevín Negro'];

        document.addEventListener("DOMContentLoaded", () => {
            fetchGoogleSheetsData();
        });

        function parseSpanishDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.trim().split('/');
            if (parts.length === 3) {
                const day = parts[0].padStart(2, '0');
                const month = parts[1].padStart(2, '0');
                const year = parts[2];
                return `${year}-${month}-${day}`;
            }
            return dateStr;
        }

        function fetchGoogleSheetsData() {
            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        RAW_DATA = results.data.map(row => ({
                            categoria: (row['Categoría'] || '').trim(),
                            fecha: parseSpanishDate(row['Fecha'] || ''),
                            hora: (row['Hora'] || '').trim(),
                            instalacion: (row['Instalación / Pista'] || '').trim(),
                            jornada: (row['Jornada'] || '').trim(),
                            local: (row['Equipo Local'] || '').trim(),
                            visitante: (row['Equipo Visitante'] || '').trim(),
                            resultado: (row['Resultado'] || '-').trim(),
                            mapa: (row['Mapa'] || '').trim()
                        })).filter(r => r.categoria && r.fecha);

                        ALL_CATEGORIES = [...new Set(RAW_DATA.map(item => item.categoria))].sort();
                        
                        document.getElementById('sync-status').className = "inline-block w-2 h-2 rounded-full bg-emerald-400";
                        document.getElementById('sync-text').textContent = "Conectado en vivo a Google Sheets";

                        renderCategoryButtons();
                        renderView();
                        lucide.createIcons();
                    }
                },
                error: function(err) {
                    console.error("Error al cargar Google Sheets CSV:", err);
                    document.getElementById('sync-status').className = "inline-block w-2 h-2 rounded-full bg-rose-500";
                    document.getElementById('sync-text').textContent = "Error al conectar con la hoja";
                }
            });
        }

        function renderCategoryButtons() {
            const container = document.getElementById('category-buttons');
            container.innerHTML = '';
            
            // "Todas" button
            const allBtn = document.createElement('button');
            allBtn.className = `px-3 py-1.5 rounded-xl text-xs font-medium border transition ${selectedCategories.length === ALL_CATEGORIES.length ? 'bg-indigo-900 text-white border-indigo-900 shadow-sm' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'}`;
            allBtn.textContent = 'Todas';
            allBtn.onclick = () => {
                if(selectedCategories.length === ALL_CATEGORIES.length) {
                    selectedCategories = [];
                } else {
                    selectedCategories = [...ALL_CATEGORIES];
                }
                renderCategoryButtons();
                renderView();
            };
            container.appendChild(allBtn);

            ALL_CATEGORIES.forEach(cat => {
                const isSelected = selectedCategories.includes(cat);
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-xl text-xs font-medium border transition flex items-center gap-1.5 ${isSelected ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100'}`;
                btn.innerHTML = `${isSelected ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}${cat}`;
                btn.onclick = () => {
                    if (selectedCategories.includes(cat)) {
                        selectedCategories = selectedCategories.filter(c => c !== cat);
                    } else {
                        selectedCategories.push(cat);
                    }
                    renderCategoryButtons();
                    renderView();
                };
                container.appendChild(btn);
            });
            lucide.createIcons();
        }

        function switchView(view) {
            currentView = view;
            const tabCal = document.getElementById('tab-calendar');
            const tabList = document.getElementById('tab-list');
            const calContainer = document.getElementById('calendar-container');
            const listContainer = document.getElementById('list-container');
            const legend = document.getElementById('calendar-legend');

            if (view === 'calendar') {
                tabCal.className = "px-3 py-1.5 rounded-lg font-medium transition bg-indigo-600 text-white shadow-sm flex items-center gap-1.5";
                tabList.className = "px-3 py-1.5 rounded-lg font-medium transition text-indigo-200 hover:text-white flex items-center gap-1.5";
                calContainer.classList.remove('hidden');
                listContainer.classList.add('hidden');
                legend.classList.remove('hidden');
            } else {
                tabList.className = "px-3 py-1.5 rounded-lg font-medium transition bg-indigo-600 text-white shadow-sm flex items-center gap-1.5";
                tabCal.className = "px-3 py-1.5 rounded-lg font-medium transition text-indigo-200 hover:text-white flex items-center gap-1.5";
                listContainer.classList.remove('hidden');
                calContainer.classList.add('hidden');
                legend.classList.add('hidden');
            }
            renderView();
        }

        function getFilteredData() {
            const selectedMonth = document.getElementById('month-select').value;
            return RAW_DATA.filter(item => {
                const matchCategory = selectedCategories.length === 0 || selectedCategories.includes(item.categoria);
                const matchMonth = selectedMonth === 'ALL' || item.fecha.startsWith(selectedMonth);
                return matchCategory && matchMonth;
            });
        }

        function renderView() {
            if (currentView === 'calendar') {
                renderCalendarView();
            } else {
                renderListView();
            }
        }

        function renderCalendarView() {
            const container = document.getElementById('calendar-container');
            container.innerHTML = '';

            const selectedMonth = document.getElementById('month-select').value;
            let monthList = [];

            if (selectedMonth === 'ALL') {
                monthList = ['2026-09', '2026-10', '2026-11', '2026-12', '2027-01', '2027-02', '2027-03', '2027-04', '2027-05'];
            } else {
                monthList = [selectedMonth];
            }

            const filteredData = RAW_DATA.filter(item => selectedCategories.includes(item.categoria));

            monthList.forEach(yearMonth => {
                const [year, month] = yearMonth.split('-').map(Number);
                const monthCard = createMonthCard(year, month, filteredData);
                container.appendChild(monthCard);
            });
            lucide.createIcons();
        }

        function createMonthCard(year, month, matches) {
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            
            const monthWrapper = document.createElement('div');
            monthWrapper.className = "bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6";

            const header = document.createElement('h2');
            header.className = "text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between";
            header.innerHTML = `<span>${monthNames[month - 1]} ${year}</span>`;
            monthWrapper.appendChild(header);

            // Calendar Grid
            const grid = document.createElement('div');
            grid.className = "grid grid-cols-7 gap-1 sm:gap-2 text-center text-xs";

            // Headers L M X J V S D
            const days = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
            days.forEach((d, idx) => {
                const dEl = document.createElement('div');
                dEl.className = `font-bold py-1 ${idx >= 5 ? 'text-rose-600' : 'text-slate-400'}`;
                dEl.textContent = d;
                grid.appendChild(dEl);
            });

            // Calculate calendar structure
            const firstDay = new Date(year, month - 1, 1);
            let startingDay = firstDay.getDay() - 1; // 0 = Mon
            if (startingDay === -1) startingDay = 6; // Sunday

            const totalDays = new Date(year, month, 0).getDate();

            // Empty cells before 1st day
            for (let i = 0; i < startingDay; i++) {
                const empty = document.createElement('div');
                empty.className = "p-2 min-h-[60px] sm:min-h-[80px] rounded-xl bg-slate-50/50";
                grid.appendChild(empty);
            }

            // Days of the month
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const currDate = new Date(year, month - 1, day);
                const dayOfWeek = currDate.getDay(); // 0 = Sun, 6 = Sat
                const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

                const dayMatches = matches.filter(m => m.fecha === dateStr);

                const cell = document.createElement('div');
                cell.className = "p-1.5 sm:p-2 min-h-[65px] sm:min-h-[85px] rounded-xl border flex flex-col justify-start items-stretch text-left relative transition";

                if (isWeekend) {
                    const satDate = new Date(currDate);
                    satDate.setDate(currDate.getDate() - (dayOfWeek === 0 ? 1 : 0));
                    const sunDate = new Date(satDate);
                    sunDate.setDate(satDate.getDate() + 1);
                    const friDate = new Date(satDate);
                    friDate.setDate(satDate.getDate() - 1);

                    const satStr = satDate.toISOString().split('T')[0];
                    const sunStr = sunDate.toISOString().split('T')[0];
                    const friStr = friDate.toISOString().split('T')[0];

                    const wMatches = matches.filter(m => m.fecha === satStr || m.fecha === sunStr || m.fecha === friStr);
                    const activeCategoriesWithMatches = new Set(wMatches.map(m => m.categoria));

                    if (selectedCategories.length === 0 || activeCategoriesWithMatches.size === 0) {
                        cell.className += " bg-emerald-50/80 border-emerald-300 text-emerald-950";
                    } else if (selectedCategories.length > 1 && activeCategoriesWithMatches.size < selectedCategories.length) {
                        cell.className += " bg-amber-50/90 border-amber-300 text-amber-950";
                    } else {
                        cell.className += " bg-rose-50/80 border-rose-300 text-rose-950";
                    }
                } else {
                    cell.className += " bg-white border-slate-200 text-slate-700";
                }

                // Day number
                const num = document.createElement('span');
                num.className = `font-bold text-xs mb-1 ${isWeekend ? 'text-slate-900' : 'text-slate-500'}`;
                num.textContent = day;
                cell.appendChild(num);

                // Matches inside cell
                if (dayMatches.length > 0) {
                    const matchBox = document.createElement('div');
                    matchBox.className = "space-y-1 overflow-y-auto max-h-[50px] sm:max-h-[65px]";
                    dayMatches.forEach(m => {
                        const mEl = document.createElement('div');
                        mEl.className = "text-[10px] sm:text-xs leading-tight bg-indigo-600 text-white p-1 rounded-md shadow-xs font-medium";
                        mEl.title = `${m.categoria}: ${m.local} vs ${m.visitante} (${m.instalacion})`;
                        mEl.innerHTML = `<span class="block font-bold truncate">${m.categoria}</span><span class="opacity-90 truncate block">${m.local} vs ${m.visitante}</span>`;
                        matchBox.appendChild(mEl);
                    });
                    cell.appendChild(matchBox);
                }

                grid.appendChild(cell);
            }

            monthWrapper.appendChild(grid);
            return monthWrapper;
        }

        function renderListView() {
            const container = document.getElementById('list-container');
            container.innerHTML = '';

            const filteredData = getFilteredData().sort((a, b) => a.fecha.localeCompare(b.fecha));

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500">
                        <i data-lucide="calendar-x" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        <p class="font-medium">No hay partidos registrados para los filtros seleccionados.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filteredData.forEach(match => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3";

                const dateFormatted = new Date(match.fecha + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-0.5 rounded-full">${match.categoria}</span>
                            <span class="text-xs font-medium text-slate-500 uppercase">${match.jornada}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-base">${match.local} <span class="text-slate-400 font-normal">vs</span> ${match.visitante}</h3>
                        <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
                            <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> ${dateFormatted}</span>
                            ${match.hora ? `<span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${match.hora}</span>` : ''}
                            <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${match.instalacion}</span>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100">
                        <span class="text-sm font-semibold px-3 py-1 bg-slate-100 text-slate-700 rounded-lg">${match.resultado !== '-' ? 'Resultado: ' + match.resultado : 'Pendiente'}</span>
                        ${match.mapa ? `<a href="${match.mapa}" target="_blank" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition" title="Ver ubicación"><i data-lucide="navigation" class="w-4 h-4"></i></a>` : ''}
                    </div>
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
        }
    </script>
</body>
</html>
