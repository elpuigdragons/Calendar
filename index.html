<style>
  :root {
    --bg: #0E0D0C;
    --bg-alt: #161514;
    --card: #1B1918;
    --ink: #F5F3EF;
    --ink-dim: #928D86;
    --ember: #C8202C;
    --silver: #E2E0DB;
    --line: #2A2826;
    --win: #4FBF6E;
    --loss: #E14B4B;
    --draw: #D9A536;
    --black-team: #0E0D0C;
    --white-team: #F5F3EF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .display {
    font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 0.86;
  }
  .wrap { max-width: 950px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; }

  /* ---------- HERO ---------- */
  header.hero {
    position: relative;
    padding: 40px 0 24px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .hero-flame {
    position: absolute;
    top: -30%; right: -14%;
    width: 55%; height: 160%;
    background: radial-gradient(circle at 60% 40%, rgba(200,32,44,0.16), transparent 65%);
    pointer-events: none;
  }
  .brand-row { display: flex; align-items: center; gap: 20px; }
  .badge {
    width: 80px; height: 80px;
    border-radius: 18px; flex: none; object-fit: contain;
    background: var(--silver); padding: 6px;
    box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,0.5);
  }
  h1.club-name { font-size: clamp(2rem, 7vw, 4rem); margin: 0; color: var(--ink); }
  h1.club-name .accent { color: var(--ember); }

  /* ---------- NEXT MATCH CARD ---------- */
  .next-match {
    margin-top: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ember);
    border-radius: 4px;
    padding: 16px 20px;
  }
  .nm-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .nm-header .label { font-size: 0.8rem; color: var(--ink-dim); margin: 0; }
  .nm-item { padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); }
  .nm-item:first-child { padding-top: 10px; margin-top: 10px; }
  .nm-item .cat-label { font-size: 0.78rem; color: var(--ink-dim); }
  .nm-item .matchup { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.3rem; color: var(--ink); }
  .nm-item .matchup .dragons { color: var(--ember); }
  .nm-item .matchup .vs { color: var(--ink-dim); padding: 0 6px; font-family: 'Manrope', sans-serif; font-size: 0.85rem; }
  .nm-item .meta { color: var(--ink-dim); font-size: 0.82rem; margin-top: 2px; }
  .countdown { display: flex; gap: 10px; }
  .countdown .unit { text-align: center; min-width: 40px; }
  .countdown .num { font-family: 'Big Shoulders Display', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--ember); line-height: 1; }
  .countdown .u-label { font-size: 0.6rem; color: var(--ink-dim); }

  /* ---------- CONTROLS & FILTERS ---------- */
  .controls-bar {
    margin-top: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  @media (min-width: 640px) {
    .controls-bar { flex-direction: row; align-items: center; justify-content: space-between; }
  }
  .filter-label { font-size: 0.75rem; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-alt); border: 1px solid var(--line);
    color: var(--ink-dim); padding: 6px 12px; border-radius: 100px;
    font-size: 0.82rem; font-weight: 600; cursor: pointer; user-select: none;
    transition: all .15s;
  }
  .chip.active { background: var(--ember); border-color: var(--ember); color: #fff; }
  .chip:not(.active):hover { border-color: var(--silver); color: var(--ink); }

  select.month-select {
    background: var(--bg-alt);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
  }

  /* ---------- LEYENDA ---------- */
  .legend-bar {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;
    background: var(--card); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 8px; margin-top: 16px;
    font-size: 0.78rem; color: var(--ink-dim); font-weight: 600;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .legend-dot.free { background: rgba(79, 191, 110, 0.2); border: 1px solid var(--win); }
  .legend-dot.partial { background: rgba(217, 165, 54, 0.2); border: 1px solid var(--draw); }
  .legend-dot.busy { background: rgba(225, 75, 75, 0.2); border: 1px solid var(--loss); }

  /* ---------- CALENDAR GRID ---------- */
  main { padding: 24px 0; }
  .month-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .month-title {
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 1.4rem; font-weight: 800; color: var(--silver);
    margin-bottom: 12px; pb-2; border-bottom: 1px solid var(--line);
  }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-center; font-size: 0.75rem; }
  .day-header { font-weight: 800; padding: 4px 0; color: var(--ink-dim); }
  .day-header.weekend { color: var(--ember); }

  .calendar-cell {
    min-height: 70px; border-radius: 6px; border: 1px solid var(--line);
    padding: 4px; text-align: left; display: flex; flex-direction: column; justify-content: flex-start;
    background: var(--bg-alt); transition: all .15s;
  }
  .calendar-cell.free-weekend { background: rgba(79, 191, 110, 0.08); border-color: rgba(79, 191, 110, 0.3); }
  .calendar-cell.partial-weekend { background: rgba(217, 165, 54, 0.12); border-color: rgba(217, 165, 54, 0.4); }
  .calendar-cell.busy-weekend { background: rgba(225, 75, 75, 0.12); border-color: rgba(225, 75, 75, 0.4); }

  .cell-num { font-weight: 800; font-size: 0.75rem; color: var(--ink-dim); margin-bottom: 4px; }
  .is-weekend .cell-num { color: var(--ink); }

  .match-pill {
    background: var(--ember); color: #fff;
    padding: 2px 4px; border-radius: 3px;
    font-size: 0.65rem; font-weight: 700; line-height: 1.2;
    margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ---------- FOOTER ---------- */
  footer {
    padding: 24px 0; color: var(--ink-dim); font-size: 0.8rem;
    border-t: 1px solid var(--line); text-center: center; margin-top: 30px;
  }
  .sync-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--ink-dim); }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--draw); }
</style>
</head>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSl5xg397GTfLDogRcVZAXObRrp8JH7-j5YAlel0hNU1Sb33IS_WT0KxKDY_5fNKuL_YWnqUubSiG25/pub?gid=795521530&single=true&output=csv";

let RAW_DATA = [];
let ALL_CATEGORIES = [];
let selectedCategories = [];

document.addEventListener("DOMContentLoaded", () => {
  fetchData();
});

function parseSpanishDate(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.trim().split('/');
  if (parts.length === 3) {
    return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
  }
  return dateStr;
}

function fetchData() {
  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      if (results.data && results.data.length > 0) {
        RAW_DATA = results.data.map(row => ({
          categoria: (row['Categoría'] || '').trim(),
          fecha: parseSpanishDate(row['Fecha'] || ''),
          hora: (row['Hora'] || '').trim(),
          instalacion: (row['Instalación / Pista'] || '').trim(),
          jornada: (row['Jornada'] || '').trim(),
          local: (row['Equipo Local'] || '').trim(),
          visitante: (row['Equipo Visitante'] || '').trim(),
          resultado: (row['Resultado'] || '-').trim(),
          mapa: (row['Mapa'] || '').trim()
        })).filter(r => r.categoria && r.fecha);

        ALL_CATEGORIES = [...new Set(RAW_DATA.map(i => i.categoria))].sort();
        selectedCategories = [...ALL_CATEGORIES]; // Por defecto seleccionadas todas

        document.getElementById('sync-dot').style.background = 'var(--win)';
        document.getElementById('sync-text').textContent = 'Conectado en vivo a Google Sheets';

        renderChips();
        renderNextMatch();
        renderCalendar();
      }
    },
    error: function(err) {
      document.getElementById('sync-dot').style.background = 'var(--loss)';
      document.getElementById('sync-text').textContent = 'Error al conectar';
    }
  });
}

function renderChips() {
  const container = document.getElementById('category-chips');
  container.innerHTML = '';

  const allBtn = document.createElement('div');
  allBtn.className = `chip ${selectedCategories.length === ALL_CATEGORIES.length ? 'active' : ''}`;
  allBtn.textContent = 'Todas';
  allBtn.onclick = () => {
    selectedCategories = selectedCategories.length === ALL_CATEGORIES.length ? [] : [...ALL_CATEGORIES];
    renderChips();
    renderCalendar();
  };
  container.appendChild(allBtn);

  ALL_CATEGORIES.forEach(cat => {
    const isSelected = selectedCategories.includes(cat);
    const chip = document.createElement('div');
    chip.className = `chip ${isSelected ? 'active' : ''}`;
    chip.textContent = cat;
    chip.onclick = () => {
      if (selectedCategories.includes(cat)) {
        selectedCategories = selectedCategories.filter(c => c !== cat);
      } else {
        selectedCategories.push(cat);
      }
      renderChips();
      renderCalendar();
    };
    container.appendChild(chip);
  });
}

/* ---------- TARJETA PRÓXIMO PARTIDO Y CUENTATRÁS ---------- */
let countdownTimer = null;
function renderNextMatch() {
  const todayStr = new Date().toISOString().split('T')[0];
  const upcoming = RAW_DATA.filter(m => m.fecha >= todayStr).sort((a, b) => a.fecha.localeCompare(b.fecha));

  if (!upcoming.length) {
    document.getElementById('nm-label').textContent = 'No hay más partidos programados';
    document.getElementById('nm-list').innerHTML = '';
    document.getElementById('countdown').style.display = 'none';
    return;
  }

  const nextDate = upcoming[0].fecha;
  const dayMatches = upcoming.filter(m => m.fecha === nextDate);

  const dateObj = new Date(nextDate + 'T00:00:00');
  const dateStr = dateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('nm-label').textContent = `Próximos partidos · ${dateStr}`;

  document.getElementById('nm-list').innerHTML = dayMatches.map(f => `
    <div class="nm-item">
      <div class="cat-label">${f.categoria} · ${f.jornada}</div>
      <div class="matchup"><span class="dragons">${f.local}</span> <span class="vs">vs</span> ${f.visitante}</div>
      <div class="meta">${f.hora ? f.hora + ' · ' : 'Hora pendiente · '}${f.instalacion}</div>
    </div>
  `).join('');

  if (countdownTimer) clearInterval(countdownTimer);
  const targetDate = new Date(nextDate + 'T00:00:00');
  if (dayMatches[0].hora) {
    const [hh, mm] = dayMatches[0].hora.replace('.', ':').split(':').map(Number);
    if(!isNaN(hh)) targetDate.setHours(hh, mm || 0, 0, 0);
  }

  function tick() {
    let diff = targetDate - new Date();
    if (diff < 0) diff = 0;
    document.getElementById('cd-d').textContent = Math.floor(diff / 86400000);
    document.getElementById('cd-h').textContent = Math.floor((diff % 86400000) / 3600000);
    document.getElementById('cd-m').textContent = Math.floor((diff % 3600000) / 60000);
  }
  tick();
  countdownTimer = setInterval(tick, 30000);
}

/* ---------- RENDER DEL CALENDARIO MENSUAL ---------- */
function renderCalendar() {
  const container = document.getElementById('calendar-container');
  container.innerHTML = '';

  const selectedMonth = document.getElementById('month-select').value;
  let monthList = (selectedMonth === 'ALL')
    ? ['2026-09', '2026-10', '2026-11', '2026-12', '2027-01', '2027-02', '2027-03', '2027-04', '2027-05']
    : [selectedMonth];

  const filteredData = RAW_DATA.filter(item => selectedCategories.includes(item.categoria));

  monthList.forEach(yearMonth => {
    const [year, month] = yearMonth.split('-').map(Number);
    container.appendChild(createMonthCard(year, month, filteredData));
  });
}

function createMonthCard(year, month, matches) {
  const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

  const monthWrapper = document.createElement('div');
  monthWrapper.className = "month-card";

  const title = document.createElement('div');
  title.className = "month-title";
  title.textContent = `${monthNames[month - 1]} ${year}`;
  monthWrapper.appendChild(title);

  const grid = document.createElement('div');
  grid.className = "calendar-grid";

  // Días de la semana
  const days = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  days.forEach((d, idx) => {
    const dEl = document.createElement('div');
    dEl.className = `day-header ${idx >= 5 ? 'weekend' : ''}`;
    dEl.textContent = d;
    grid.appendChild(dEl);
  });

  const firstDay = new Date(year, month - 1, 1);
  let startingDay = firstDay.getDay() - 1;
  if (startingDay === -1) startingDay = 6;

  const totalDays = new Date(year, month, 0).getDate();

  for (let i = 0; i < startingDay; i++) {
    const empty = document.createElement('div');
    empty.style.opacity = '0.2';
    grid.appendChild(empty);
  }

  for (let day = 1; day <= totalDays; day++) {
    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const currDate = new Date(year, month - 1, day);
    const dayOfWeek = currDate.getDay();
    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

    const dayMatches = matches.filter(m => m.fecha === dateStr);

    const cell = document.createElement('div');
    cell.className = `calendar-cell ${isWeekend ? 'is-weekend' : ''}`;

    if (isWeekend) {
      const satDate = new Date(currDate);
      satDate.setDate(currDate.getDate() - (dayOfWeek === 0 ? 1 : 0));
      const sunDate = new Date(satDate);
      sunDate.setDate(satDate.getDate() + 1);
      const friDate = new Date(satDate);
      friDate.setDate(satDate.getDate() - 1);

      const wMatches = matches.filter(m => [satDate.toISOString().split('T')[0], sunDate.toISOString().split('T')[0], friDate.toISOString().split('T')[0]].includes(m.fecha));
      const activeCategoriesWithMatches = new Set(wMatches.map(m => m.categoria));

      if (selectedCategories.length === 0 || activeCategoriesWithMatches.size === 0) {
        cell.classList.add('free-weekend');
      } else if (selectedCategories.length > 1 && activeCategoriesWithMatches.size < selectedCategories.length) {
        cell.classList.add('partial-weekend');
      } else {
        cell.classList.add('busy-weekend');
      }
    }

    const num = document.createElement('span');
    num.className = "cell-num";
    num.textContent = day;
    cell.appendChild(num);

    if (dayMatches.length > 0) {
      dayMatches.forEach(m => {
        const matchEl = document.createElement('div');
        matchEl.className = "match-pill";
        matchEl.title = `${m.categoria}: ${m.local} vs ${m.visitante} (${m.instalacion})`;
        matchEl.textContent = `${m.categoria.replace('Benjamín', 'Benj.').replace('Alevín', 'Alev.')}: ${m.local.replace('DRAGONS EL PUIG', 'Dragons')} vs ${m.visitante.replace('DRAGONS EL PUIG', 'Dragons')}`;
        cell.appendChild(matchEl);
      });
    }

    grid.appendChild(cell);
  }

  monthWrapper.appendChild(grid);
  return monthWrapper;
}
</script>
</body>
</html>
