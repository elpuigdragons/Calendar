<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragons El Puig — Calendario 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- PapaParse para leer el CSV de Google Sheets -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root {
    --bg: #0E0D0C;
    --bg-alt: #161514;
    --card: #1B1918;
    --ink: #F5F3EF;
    --ink-dim: #928D86;
    --ember: #C8202C;
    --silver: #E2E0DB;
    --line: #2A2826;
    --win: #4FBF6E;
    --loss: #E14B4B;
    --draw: #D9A536;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .display {
    font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 0.86;
  }
  .wrap { max-width: 950px; margin: 0 auto; padding: 0 20px; }
  a { color: inherit; }

  /* ---------- HERO ---------- */
  header.hero {
    position: relative;
    padding: 36px 0 20px;
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }
  .hero-flame {
    position: absolute;
    top: -30%; right: -14%;
    width: 55%; height: 160%;
    background: radial-gradient(circle at 60% 40%, rgba(200,32,44,0.16), transparent 65%);
    pointer-events: none;
  }
  .brand-row { display: flex; align-items: center; gap: 20px; }
  .badge {
    width: 84px; height: 84px;
    border-radius: 18px; flex: none; object-fit: contain;
    background: var(--silver); padding: 6px;
    box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,0.5);
  }
  h1.club-name { font-size: clamp(2.2rem, 7vw, 4.2rem); margin: 0; color: var(--ink); }
  h1.club-name .accent { color: var(--ember); }

  /* ---------- CONTROLES Y FILTROS ---------- */
  .controls-bar {
    margin-top: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  @media (min-width: 640px) {
    .controls-bar { flex-direction: row; align-items: center; justify-content: space-between; }
  }
  .filter-label { font-size: 0.75rem; font-weight: 700; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bg-alt); border: 1px solid var(--line);
    color: var(--ink-dim); padding: 6px 12px; border-radius: 100px;
    font-size: 0.82rem; font-weight: 600; cursor: pointer; user-select: none;
    transition: all .15s;
  }
  .chip.active { background: var(--ember); border-color: var(--ember); color: #fff; }
  .chip:not(.active):hover { border-color: var(--silver); color: var(--ink); }

  select.month-select {
    background: var(--bg-alt);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
  }

  /* ---------- LEYENDA ---------- */
  .legend-bar {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px;
    background: var(--card); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 8px; margin-top: 14px;
    font-size: 0.78rem; color: var(--ink-dim); font-weight: 600;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .legend-dot.free { background: rgba(79, 191, 110, 0.2); border: 1px solid var(--win); }
  .legend-dot.partial { background: rgba(217, 165, 54, 0.2); border: 1px solid var(--draw); }
  .legend-dot.busy { background: rgba(225, 75, 75, 0.2); border: 1px solid var(--loss); }

  /* ---------- CALENDARIO GRID ---------- */
  main { padding: 24px 0; }
  .month-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .month-title {
    font-family: 'Big Shoulders Display', sans-serif;
    font-size: 1.4rem; font-weight: 800; color: var(--silver);
    margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.75rem; }
  .day-header { font-weight: 800; padding: 4px 0; color: var(--ink-dim); }
  .day-header.weekend { color: var(--ember); }

  .calendar-cell {
    min-height: 75px; border-radius: 6px; border: 1px solid var(--line);
    padding: 4px; text-align: left; display: flex; flex-direction: column; justify-content: flex-start;
    background: var(--bg-alt); transition: all .15s;
  }
  .calendar-cell.free-weekend { background: rgba(79, 191, 110, 0.08); border-color: rgba(79, 191, 110, 0.3); }
  .calendar-cell.partial-weekend { background: rgba(217, 165, 54, 0.12); border-color: rgba(217, 165, 54, 0.4); }
  .calendar-cell.busy-weekend { background: rgba(225, 75, 75, 0.12); border-color: rgba(225, 75, 75, 0.4); }

  .cell-num { font-weight: 800; font-size: 0.75rem; color: var(--ink-dim); margin-bottom: 4px; }
  .is-weekend .cell-num { color: var(--ink); }

  /* Estilos del partido compacto */
  .match-pill {
    background: var(--ember); color: #fff;
    padding: 3px 5px; border-radius: 4px;
    font-size: 0.65rem; font-weight: 700; line-height: 1.2;
    margin-bottom: 4px; display: flex; align-items: center; gap: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .match-pill-logo {
    width: 14px; height: 14px; flex: none;
    object-fit: contain; background: #fff; border-radius: 3px; padding: 1px;
  }
  .match-pill-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  footer {
    padding: 24px 0; color: var(--ink-dim); font-size: 0.8rem;
    border-top: 1px solid var(--line); text-center: center; margin-top: 30px;
  }
  .sync-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--ink-dim); justify-content: center; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--draw); }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-flame"></div>
  <div class="wrap">
    <div class="brand-row">
      <img class="badge" src="logos/puig.png" alt="Dragons El Puig" onerror="this.onerror=null; this.src='https://elpuigdragons.github.io/Calendario_26_27/logos/puig.png';">
      <h1 class="club-name display">DRAGONS<br><span class="accent">EL PUIG</span></h1>
    </div>

    <!-- CONTROLES Y FILTROS -->
    <div class="controls-bar">
      <div>
        <span class="filter-label">Filtrar por Categoría</span>
        <div id="category-chips" class="chips"></div>
      </div>
      <div>
        <span class="filter-label">Mes</span>
        <select id="month-select" onchange="renderCalendar()" class="month-select">
          <option value="ALL">Todo el Calendario</option>
          <option value="2026-09">Septiembre 2026</option>
          <option value="2026-10" selected>Octubre 2026</option>
          <option value="2026-11">Noviembre 2026</option>
          <option value="2026-12">Diciembre 2026</option>
          <option value="2027-01">Enero 2027</option>
          <option value="2027-02">Febrero 2027</option>
          <option value="2027-03">Marzo 2027</option>
          <option value="2027-04">Abril 2027</option>
          <option value="2027-05">Mayo 2027</option>
        </select>
      </div>
    </div>

    <!-- LEYENDA -->
    <div class="legend-bar">
      <div class="legend-item"><span class="legend-dot free"></span> Fin de semana libre</div>
      <div class="legend-item"><span class="legend-dot partial"></span> Libre para alguna categoría</div>
      <div class="legend-item"><span class="legend-dot busy"></span> Ocupado (Con partidos)</div>
    </div>

  </div>
</header>

<main class="wrap">
  <div id="calendar-container"></div>
</main>

<footer>
  <div class="wrap" style="text-align: center;">
    <p style="margin-bottom: 8px;">© 2026 Dragons El Puig Hockey Club • Sincronizado.</p>
    <div class="sync-tag">
      <span class="sync-dot" id="sync-dot"></span>
      <span id="sync-text">Conectando...</span>
    </div>
  </div>
</footer>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSl5xg397GTfLDogRcVZAXObRrp8JH7-j5YAlel0hNU1Sb33IS_WT0KxKDY_5fNKuL_YWnqUubSiG25/pub?gid=795521530&single=true&output=csv";

/* Diccionario de abreviaturas por defecto */
const DEFAULT_ABBR = {
  'PreBenjamín': 'PB',
  'Benjamín Blanco': 'BB',
  'Benjamín Negro': 'BN',
  'Alevín Blanco': 'AB',
  'Alevín Negro': 'AN',
  'Infantil': 'INF',
  'Juvenil': 'JUV'
};

/* Función para obtener la abreviatura (usa Sheets si existe la columna 'Abreviatura', o el diccionario por defecto) */
function getAbbr(categoria, rawRow) {
  if (rawRow && rawRow['Abreviatura'] && rawRow['Abreviatura'].trim()) {
    return rawRow['Abreviatura'].trim();
  }
  return DEFAULT_ABBR[categoria] || categoria.substring(0, 3).toUpperCase();
}

const LOGO_RULES = [
  [/DRAGONS/i,    'puig.png'],
  [/ALAS/i,       'alas.png'],
  [/DIABLOS/i,    'dia.png'],
  [/DINO/i,       'dino.png'],
  [/HALCONES/i,   'hal.png'],
  [/CASTELL/i,    'hcc.png'],
  [/SKULLS/i,     'skulls.png'],
  [/TAURONS/i,    'tau.png'],
  [/TITANES/i,    'tita.png'],
  [/LLOPS|VILA/i, 'vila.png']
];

function logoFor(name) {
  const hit = LOGO_RULES.find(([re]) => re.test(name));
  return hit ? 'logos/' + hit[1] : '';
}

let RAW_DATA = [];
let ALL_CATEGORIES = [];
let selectedCategories = [];

document.addEventListener("DOMContentLoaded", () => {
  fetchData();
});

function parseSpanishDate(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.trim().split('/');
  if (parts.length === 3) {
    return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
  }
  return dateStr;
}

function fetchData() {
  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      if (results.data && results.data.length > 0) {
        RAW_DATA = results.data.map(row => {
          const cat = (row['Categoría'] || '').trim();
          return {
            categoria: cat,
            abbr: getAbbr(cat, row),
            fecha: parseSpanishDate(row['Fecha'] || ''),
            hora: (row['Hora'] || '').trim(),
            instalacion: (row['Instalación / Pista'] || '').trim(),
            jornada: (row['Jornada'] || '').trim(),
            local: (row['Equipo Local'] || '').trim(),
            visitante: (row['Equipo Visitante'] || '').trim(),
            resultado: (row['Resultado'] || '-').trim(),
            mapa: (row['Mapa'] || '').trim()
          };
        }).filter(r => r.categoria && r.fecha);

        ALL_CATEGORIES = [...new Set(RAW_DATA.map(i => i.categoria))].sort();
        selectedCategories = [...ALL_CATEGORIES];

        document.getElementById('sync-dot').style.background = 'var(--win)';
        document.getElementById('sync-text').textContent = 'Conectado origen de datos';

        renderChips();
        renderCalendar();
      }
    },
    error: function(err) {
      document.getElementById('sync-dot').style.background = 'var(--loss)';
      document.getElementById('sync-text').textContent = 'Error al conectar con origen de datos';
    }
  });
}

function renderChips() {
  const container = document.getElementById('category-chips');
  container.innerHTML = '';

  const allBtn = document.createElement('div');
  allBtn.className = `chip ${selectedCategories.length === ALL_CATEGORIES.length ? 'active' : ''}`;
  allBtn.textContent = 'Todas';
  allBtn.onclick = () => {
    selectedCategories = selectedCategories.length === ALL_CATEGORIES.length ? [] : [...ALL_CATEGORIES];
    renderChips();
    renderCalendar();
  };
  container.appendChild(allBtn);

  ALL_CATEGORIES.forEach(cat => {
    const isSelected = selectedCategories.includes(cat);
    const item = RAW_DATA.find(r => r.categoria === cat);
    const abbr = item ? item.abbr : '';

    const chip = document.createElement('div');
    chip.className = `chip ${isSelected ? 'active' : ''}`;
    chip.textContent = `${cat} (${abbr})`;
    chip.onclick = () => {
      if (selectedCategories.includes(cat)) {
        selectedCategories = selectedCategories.filter(c => c !== cat);
      } else {
        selectedCategories.push(cat);
      }
      renderChips();
      renderCalendar();
    };
    container.appendChild(chip);
  });
}

function renderCalendar() {
  const container = document.getElementById('calendar-container');
  container.innerHTML = '';

  const selectedMonth = document.getElementById('month-select').value;
  let monthList = (selectedMonth === 'ALL')
    ? ['2026-09', '2026-10', '2026-11', '2026-12', '2027-01', '2027-02', '2027-03', '2027-04', '2027-05']
    : [selectedMonth];

  const filteredData = RAW_DATA.filter(item => selectedCategories.includes(item.categoria));

  monthList.forEach(yearMonth => {
    const [year, month] = yearMonth.split('-').map(Number);
    container.appendChild(createMonthCard(year, month, filteredData));
  });
}

function createMonthCard(year, month, matches) {
  const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

  const monthWrapper = document.createElement('div');
  monthWrapper.className = "month-card";

  const title = document.createElement('div');
  title.className = "month-title";
  title.textContent = `${monthNames[month - 1]} ${year}`;
  monthWrapper.appendChild(title);

  const grid = document.createElement('div');
  grid.className = "calendar-grid";

  const days = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
  days.forEach((d, idx) => {
    const dEl = document.createElement('div');
    dEl.className = `day-header ${idx >= 5 ? 'weekend' : ''}`;
    dEl.textContent = d;
    grid.appendChild(dEl);
  });

  const firstDay = new Date(year, month - 1, 1);
  let startingDay = firstDay.getDay() - 1;
  if (startingDay === -1) startingDay = 6;

  const totalDays = new Date(year, month, 0).getDate();

  for (let i = 0; i < startingDay; i++) {
    const empty = document.createElement('div');
    empty.style.opacity = '0.2';
    grid.appendChild(empty);
  }

  for (let day = 1; day <= totalDays; day++) {
    const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const currDate = new Date(year, month - 1, day);
    const dayOfWeek = currDate.getDay();
    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

    const dayMatches = matches.filter(m => m.fecha === dateStr);

    const cell = document.createElement('div');
    cell.className = `calendar-cell ${isWeekend ? 'is-weekend' : ''}`;

    if (isWeekend) {
      const satDate = new Date(currDate);
      satDate.setDate(currDate.getDate() - (dayOfWeek === 0 ? 1 : 0));
      const sunDate = new Date(satDate);
      sunDate.setDate(satDate.getDate() + 1);
      const friDate = new Date(satDate);
      friDate.setDate(satDate.getDate() - 1);

      const wMatches = matches.filter(m => [satDate.toISOString().split('T')[0], sunDate.toISOString().split('T')[0], friDate.toISOString().split('T')[0]].includes(m.fecha));
      const activeCategoriesWithMatches = new Set(wMatches.map(m => m.categoria));

      if (selectedCategories.length === 0 || activeCategoriesWithMatches.size === 0) {
        cell.classList.add('free-weekend');
      } else if (selectedCategories.length > 1 && activeCategoriesWithMatches.size < selectedCategories.length) {
        cell.classList.add('partial-weekend');
      } else {
        cell.classList.add('busy-weekend');
      }
    }

    const num = document.createElement('span');
    num.className = "cell-num";
    num.textContent = day;
    cell.appendChild(num);

    if (dayMatches.length > 0) {
      dayMatches.forEach(m => {
        const matchEl = document.createElement('div');
        matchEl.className = "match-pill";
        
        const rivalName = /DRAGONS/i.test(m.local) ? m.visitante : m.local;
        const logoSrc = logoFor(rivalName);
        
        let logoImg = '';
        if (logoSrc) {
          logoImg = `<img class="match-pill-logo" src="${logoSrc}" alt="" onerror="this.remove();">`;
        }

        const localShort = m.local.replace(/DRAGONS EL PUIG\s*/i, 'Dragons ');
        const visitanteShort = m.visitante.replace(/DRAGONS EL PUIG\s*/i, 'Dragons ');

        matchEl.title = `${m.categoria}: ${m.local} vs ${m.visitante} (${m.instalacion}${m.hora ? ' · ' + m.hora : ''})`;
        matchEl.innerHTML = `${logoImg}<span class="match-pill-text"><b>${m.abbr}</b>: ${localShort} vs ${visitanteShort}</span>`;
        cell.appendChild(matchEl);
      });
    }

    grid.appendChild(cell);
  }

  monthWrapper.appendChild(grid);
  return monthWrapper;
}
</script>
</body>
</html>
